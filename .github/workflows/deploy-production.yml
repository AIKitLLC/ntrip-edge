name: Deploy production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to publish main to production (ntrip.ai-kit.net)'
        required: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  SITE_URL: https://ntrip.ai-kit.net

jobs:
  deploy:
    name: Deploy ntrip-edge to ntrip.ai-kit.net
    if: inputs.confirm == 'deploy' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare credentials
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are not set."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and tests
        run: |
          pnpm typecheck
          pnpm test

      - name: Deploy ntrip-edge (production)
        run: |
          pnpm exec wrangler deploy 2>&1 | tee deploy.log

      - name: Smoke test the live site
        run: |
          for attempt in $(seq 1 36); do
            if curl -fsS "$SITE_URL/health" -o health.json; then break; fi
            echo "attempt $attempt: $SITE_URL not reachable yet"; sleep 5
          done
          cat health.json
          curl -fsS -H "Ntrip-Version: Ntrip/2.0" "$SITE_URL/sourcetable" | grep -q "ENDSOURCETABLE"
          curl -fsS "$SITE_URL/HAN0-VN?epochs=1" -o han0.rtcm3
          test -s han0.rtcm3
